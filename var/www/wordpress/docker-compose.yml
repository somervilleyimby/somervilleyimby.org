networks:
  wordpress:
    driver: bridge

services:
  db:
    image: mysql:9
    container_name: db
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_DATABASE: $MYSQL_DATABASE
      MYSQL_PASSWORD: $MYSQL_PASSWORD
      MYSQL_ROOT_PASSWORD: $MYSQL_ROOT_PASSWORD
      MYSQL_USER: $MYSQL_USER
    volumes:
      - db:/var/lib/mysql
    networks:
      - wordpress

  cache:
    image: redis:8
    container_name: cache
    restart: unless-stopped
    networks:
      - wordpress

  wordpress:
    depends_on:
      - db
      - cache
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordpress
    restart: unless-stopped
    env_file: .env
    ports:
      - 127.0.0.1:9000:9000
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: $MYSQL_USER
      WORDPRESS_DB_PASSWORD: $MYSQL_PASSWORD
      WORDPRESS_DB_NAME: $MYSQL_DATABASE
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://somervilleyimby.org');
        define('WP_SITEURL', 'https://somervilleyimby.org');
        // W3TC caches its own parsed config (wp-content/w3tc-config/master.php)
        // in Redis. The object/page cache engines and their servers are set in
        // master.php itself, not here.
        define('W3TC_CONFIG_CACHE_ENGINE', 'redis');
        define('W3TC_CONFIG_CACHE_REDIS_SERVERS', 'cache:6379');
    volumes:
      - /var/www/html:/var/www/html
      - /var/www/wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini
    networks:
      - wordpress

volumes:
  db:
